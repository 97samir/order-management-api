services:
  postgres:
    image: postgres:16
    container_name: order-management-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME:?Define DB_NAME en .env}
      POSTGRES_USER: ${DB_USER:?Define DB_USER en .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: order-management-api
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      PORT: 8081

    ports:
      - "8081:8081"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: