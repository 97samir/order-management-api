server:
  port: ${PORT:8081}

app:
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:false}
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}

spring:

  application:
    name: ${APP_NAME:order-management-api}

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSL_MODE:disable}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION}
